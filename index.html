* { box-sizing: border-box; }

var num=function(v){var n=parseFloat(String(v==null?'':v).replace(/,/g,''));return isFinite(n)&&n>0?n:0;};
var $=function(s){return document.querySelector(s);};
var find=function(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;};
var sum=function(a,f){return a.reduce(function(t,x){return t+(f(x)||0);},0);};
var T=function(k,v){var s=String(k);if(v)s=s.replace(/\{(\w+)\}/g,function(m,n){return v[n]!=null?v[n]:m;});return s;};
var pad=function(n){return n<10?'0'+n:''+n;};
var startOfDay=function(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime();};
var addDays=function(t,n){var d=new Date(t);d.setDate(d.getDate()+n);return d.getTime();};
var ymd=function(t){var d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var fromYmd=function(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]).getTime():0;};
var fmtDate=function(t){return new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});};
var fmtTime=function(t){return new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});};
var extend=function(a,b){for(var k in b)if(Object.prototype.hasOwnProperty.call(b,k))a[k]=b[k];return a;};

var paidOf=function(l){return sum(l.payments,function(p){return p.amount;});};
var balOf=function(l){return Math.max(0,l.amount-paidOf(l));};
var active=function(l){return l.status==='open'&&balOf(l)>0;};
var person=function(id){return find(db.people,id)||{name:'?',phone:''};};
function dueIn(l){if(!active(l)||!l.due)return null;return Math.round((startOfDay(l.due)-startOfDay(Date.now()))/DAY);}
function totals(){var a=0,b=0;db.loans.forEach(function(l){if(!active(l))return;if(l.dir==='lent')a+=balOf(l);else b+=balOf(l);});return {lent:a,owe:b};}
function loanTag(l){
  if(l.status==='forgiven')return {t:T('Forgiven'),k:'gray'};if(l.status==='gift')return {t:T('Gift'),k:'gray'};
  if(balOf(l)<=0)return {t:T('Settled'),k:'good'};
  var d=dueIn(l);if(d==null)return null;
  if(d<0)return {t:T('Overdue {n} days',{n:-d}),k:'bad'};if(d===0)return {t:T('Due today'),k:'warn'};if(d<=3)return {t:T('Due in {n} days',{n:d}),k:'warn'};
  return {t:T('Due {d}',{d:fmtDate(l.due)}),k:'gray'};
}
function alerts(){
  var out=[];
  db.loans.forEach(function(l){
    var d=dueIn(l);if(d==null||d>3)return;var nm=person(l.pid).name,a=fmt(balOf(l));
    out.push({id:l.id,d:d,sev:d<0?'bad':'warn',t:l.dir==='lent'?T('{n} owes you {a} Birr',{n:nm,a:a}):T('You owe {n} {a} Birr',{n:nm,a:a}),s:d<0?T('Overdue by {n} days',{n:-d}):d===0?T('Due today'):T('Due in {n} days',{n:d})});
  });
  return out.sort(function(a,b){return a.d-b.d;});
}

var state={tab:'home',pq:'',ptab:'all',side:'lent',filter:'all',q:'',pages:[],sheet:null,f:{},conf:null,locked:false,pin:'',actFilter:'today',actDate:'',actFrom:'',actTo:''};
var tag=function(t,k){return '<span class="tag '+k+'">'+esc(t)+'</span>';};
var btn=function(a,label,cls,o){o=o||{};return '<button type="button" class="btn'+(cls?' '+cls:'')+' wide" data-a="'+a+'"'+(o.id?' data-id="'+esc(o.id)+'"':'')+(o.v!=null?' data-v="'+esc(o.v)+'"':'')+'>'+(o.icon?ic(o.icon,18,2):'')+esc(label)+'</button>';};

function loanRow(l){
  var p=person(l.pid),tg=loanTag(l),b=balOf(l),pc=paidOf(l);
  return '<button class="row" data-a="loan" data-id="'+l.id+'"><span class="grow"><b>'+esc(p.name)+'</b><small>'+esc(l.note||fmtDate(l.ts))+'</small>'+(tg?'<span class="tags">'+tag(tg.t,tg.k)+'</span>':'')+
    (pc>0&&b>0?'<span class="progress" style="margin-top:6px"><i style="width:'+Math.min(100,Math.round(pc/l.amount*100))+'%"></i></span>':'')+'</span><span class="end"><b class="num">'+fmt(b>0&&l.status==='open'?b:l.amount)+'</b><small>'+(pc>0&&b>0?esc(T('of {n}',{n:fmt(l.amount)})):esc(T('Birr')))+'</small></span></button>';
}

function loanList(){
  var q=state.q.trim().toLowerCase(),f=state.filter;
  var list=db.loans.filter(function(l){
    if(l.dir!==state.side)return false;var d=dueIn(l);
    if(f==='all'&&!active(l))return false;
    if(f==='overdue'&&!(d!=null&&d<0))return false;
    if(f==='soon'&&!(d!=null&&d>=0&&d<=7))return false;
    if(f==='done'&&active(l))return false;
    if(q&&(person(l.pid).name+' '+(l.note||'')).toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){var da=dueIn(a),db_=dueIn(b);if(da==null&&db_==null)return b.ts-a.ts;if(da==null)return 1;if(db_==null)return -1;return da-db_;});
  return list.length?list.map(loanRow).join(''):empty(f==='done'?T('Nothing settled yet.'):T('Nothing here. Tap + to add a loan.'));
}

/* REFINED BENTO HERO AREA WITH MODERN CURVED WAVE GRAPH */
function heroHtml(t){
  var tot=0,pd=0;db.loans.forEach(function(l){if(l.dir==='lent'&&l.status==='open'){tot+=l.amount;pd+=paidOf(l);}});
  var pct=tot?Math.round(pd/tot*100):0;
  var R=38, C=2*Math.PI*R, strokeDash=C.toFixed(1), strokeOffset=(C*(1-pct/100)).toFixed(1);

  var now=Date.now(), pts=[], i;
  for(i=7;i>=0;i--){
    var at=now-i*7*864e5, v=0;
    db.loans.forEach(function(l){
      if(l.status!=='open'||l.ts>at)return;
      var p=0; l.payments.forEach(function(x){if(x.ts<=at)p+=x.amount;});
      v+=(l.dir==='lent'?1:-1)*Math.max(0,l.amount-p);
    });
    pts.push(v);
  }
  var lo=Math.min.apply(0,pts), hi=Math.max.apply(0,pts), rg=(hi-lo)||1, W=300, H=56;
  
  // Smooth Bezier Curve generator for modern wave graph
  var coords = pts.map(function(v,k){ return {x: (k*W/7), y: (H-8-(v-lo)/rg*(H-16))}; });
  var pathD = "M" + coords[0].x.toFixed(1) + " " + coords[0].y.toFixed(1);
  for (var j = 0; j < coords.length - 1; j++) {
    var xc = (coords[j].x + coords[j+1].x) / 2;
    var yc = (coords[j].y + coords[j+1].y) / 2;
    pathD += " Q " + coords[j].x.toFixed(1) + " " + coords[j].y.toFixed(1) + ", " + xc.toFixed(1) + " " + yc.toFixed(1);
  }
  pathD += " T " + coords[coords.length-1].x.toFixed(1) + " " + coords[coords.length-1].y.toFixed(1);

  return '<div class="bento-grid">' +
    '<div class="bento-card" style="align-items:center;justify-content:center;padding:12px;">' +
      '<div class="ring-container">' +
        '<div class="ring">' +
          '<svg viewBox="0 0 100 100" aria-hidden="true">' +
            '<circle cx="50" cy="50" r="'+R+'" class="rt"/>' +
            '<circle cx="50" cy="50" r="'+R+'" class="rf" stroke-dasharray="'+strokeDash+'" stroke-dashoffset="'+strokeOffset+'"/>' +
          '</svg>' +
          '<div class="rc"><b>'+pct+'%</b><span>'+esc(T('repaid'))+'</span></div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div style="display:flex;flex-direction:column;gap:12px;">' +
      '<div class="bento-card" style="padding:12px 14px;">' +
        '<div class="card-label"><i class="dot g" style="margin-right:6px"></i>'+esc(T('People owe you'))+'</div>' +
        '<b class="num" style="font-size:20px;font-weight:800;color:var(--lent);">'+fmt(t.lent)+'</b>' +
      '</div>' +
      '<div class="bento-card" style="padding:12px 14px;">' +
        '<div class="card-label"><i class="dot o" style="margin-right:6px"></i>'+esc(T('You owe'))+'</div>' +
        '<b class="num" style="font-size:20px;font-weight:800;color:var(--owe);">'+fmt(t.owe)+'</b>' +
      '</div>' +
    '</div>' +

    '<div class="bento-card span-2" style="padding:14px 16px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;">' +
        '<div class="card-label" style="margin-bottom:0;">'+esc(T('Net position'))+'</div>' +
        '<b class="num" style="font-size:16px;font-weight:800;">'+(t.lent-t.owe>=0?'+':'-')+fmt(Math.abs(t.lent-t.owe))+' '+esc(T('Birr'))+'</b>' +
      '</div>' +
      '<div class="sparkline-container">' +
        '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" class="sparkline-svg">' +
          '<defs><linearGradient id="sparkline-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--lent)" stop-opacity="0.5"/><stop offset="100%" stop-color="var(--lent)" stop-opacity="0"/></linearGradient></defs>' +
          '<path d="'+pathD+' L'+W+' '+H+' L0 '+H+'Z" class="ta"/>' +
          '<path d="'+pathD+'" class="tl"/>' +
        '</svg>' +
      '</div>' +
      '<div style="display:flex;justify-content:space-between;margin-top:2px;"><small style="font-size:11px;color:var(--muted);">'+esc(T('Last 8 weeks'))+'</small></div>' +
    '</div>' +
  '</div>';
}

function sideBal(pid,dir){var n=0;db.loans.forEach(function(l){if(l.pid===pid&&l.dir===dir&&active(l))n+=balOf(l);});return n;}
function personNet(pid){var n=0;db.loans.forEach(function(l){if(l.pid===pid&&active(l))n+=l.dir==='lent'?balOf(l):-balOf(l);});return n;}

function peopleList(){
  var q=(state.pq||'').trim().toLowerCase(),t=state.ptab||'all';
  var rows=db.people.filter(function(p){
    if(q&&(p.name||'').toLowerCase().indexOf(q)<0&&(p.phone||'').indexOf(q)<0)return false;
    return t==='owes'?sideBal(p.id,'lent')>0:t==='owe'?sideBal(p.id,'borrowed')>0:true;
  }).map(function(p){var a=t==='owes'?sideBal(p.id,'lent'):t==='owe'?sideBal(p.id,'borrowed'):personNet(p.id);return {p:p,n:a,k:Math.abs(a)};})
  .sort(function(a,b){return b.k-a.k;}).map(function(r){
    var p=r.p,n=r.n;
    var col=t==='owes'?'var(--good)':t==='owe'?'var(--bad)':(n>0?'var(--good)':n<0?'var(--bad)':'var(--ink)');
    var lab=t==='owes'?T('owes you'):t==='owe'?T('you owe'):(n>0?T('owes you'):n<0?T('you owe'):T('settled'));
    return '<button class="row" data-a="person" data-id="'+p.id+'"><span class="grow"><b>'+esc(p.name)+'</b><small>'+esc(p.phone||T('No phone'))+'</small></span><span class="end"><b class="num" style="color:'+col+'">'+fmt(Math.abs(n))+'</b><small>'+esc(lab)+'</small></span></button>';
  }).join('');
  return rows||empty(T('No people found.'));
}

  :'<section class="card form"><h3 style="margin:0">Amanah</h3><small>'+esc(T('Track money you lend and borrow. Everything is saved locally on this phone.'))+'</small></section>';
  return pagehead(ttl)+body;
}

function actRange(){
  var t=startOfDay(Date.now()),f=state.actFilter,s,e;
  if(f==='all')return {};
  if(f==='today')return {s:t,e:addDays(t,1)};
  if(f==='yesterday')return {s:addDays(t,-1),e:t};
  if(f==='date'){s=fromYmd(state.actDate);return s?{s:s,e:addDays(s,1)}:{bad:1};}
  s=fromYmd(state.actFrom);e=fromYmd(state.actTo);
  if(!s||!e)return {bad:1};
  return {s:s,e:addDays(e,1)};
}

function actBody(){
  var r=actRange(),f=state.actFilter;
  if(r.bad)return empty(f==='date'?T('Pick a date.'):T('Pick both dates.'));
  var l=db.activity.filter(function(a){return r.s==null||(a.ts>=r.s&&a.ts<r.e);}).sort(function(a,b){return b.ts-a.ts;});
  var h='<p class="sub">'+esc(T('{n} activities',{n:l.length}))+'</p>';
  if(!l.length)return h+empty(T('Nothing recorded yet.'));
  var t0=startOfDay(Date.now()),y0=addDays(t0,-1),cur=-1;
  l.forEach(function(a){
    var d=startOfDay(a.ts);
    if(d!==cur){
      if(cur!==-1)h+='</section>';
      cur=d;
      h+='<p class="daygroup">'+esc(d===t0?T('Today'):d===y0?T('Yesterday'):fmtDate(d))+'</p><section class="card flush">';
    }
    h+='<div class="row" style="min-height:48px"><span class="grow"><b style="font-weight:600">'+esc(T(a.k,a.v))+'</b><small>'+esc(fmtTime(a.ts))+'</small></span></div>';
  });
  return h+'</section>';
}

function viewActivityTab(){
  var f=state.actFilter,mx=ymd(Date.now());
  var chip=function(v,label){return '<button type="button" class="chip" data-a="actf" data-v="'+v+'" aria-pressed="'+(f===v?'true':'false')+'">'+esc(label)+'</button>';};
  var inp=function(k,label){return '<label>'+esc(label)+'<input type="date" data-act="'+k+'" value="'+esc(state[k]||'')+'" max="'+mx+'"></label>';};
  return topbar(T('Activity'))+
  '<div class="chips" role="group">'+chip('today',T('Today'))+chip('yesterday',T('Yesterday'))+chip('date',T('Choose a date'))+chip('range',T('Date range'))+chip('all',T('All'))+'</div>'+
  (f==='date'?'<div class="daterow">'+inp('actDate',T('Date'))+'</div>':f==='range'?'<div class="daterow">'+inp('actFrom',T('From'))+inp('actTo',T('To'))+'</div>':'')+
  '<div id="actBody">'+actBody()+'</div>';
}

function viewLock(){
  var d='';for(var i=0;i<4;i++)d+='<i class="'+(i<state.pin.length?'on':'')+'"></i>';
  var keys=['1','2','3','4','5','6','7','8','9','','0','del'].map(function(k){return k===''?'<span></span>':'<button type="button" data-a="pinKey" data-v="'+k+'">'+(k==='del'?'&#9003;':k)+'</button>';}).join('');
  return '<div class="lockbox"><h1 style="text-align:center;font-family:Unbounded;">AMANAH</h1><p class="sub" style="text-align:center">'+esc(T('Enter your PIN'))+'</p><div class="dots">'+d+'</div><div class="pad">'+keys+'</div></div>';
}

var METHODS=[{g:'Cash',i:[['cash','Cash']]},{g:'Mobile wallets',i:[['telebirr','Telebirr'],['mpesa','M-Pesa'],['cbebirr','CBE Birr']]},{g:'Banks',i:[['cbe','CBE'],['abyssinia','Bank of Abyssinia']]},{g:'Other',i:[['other','Other']]}];
function mName(x){if(x.m==='other')return x.label||T('Other');for(var g=0;g<METHODS.length;g++)for(var k=0;k<METHODS[g].i.length;k++)if(METHODS[g].i[k][0]===x.m)return METHODS[g].i[k][1];return x.m;}
function mSel(){var v=F('f_meth');return v?v.split(','):[];}

function methodHtml(dir){
  var sel=mSel(),open=F('f_mopen')==='1',names=sel.map(function(k){return mName({m:k,label:F('f_mo')});}).join(', ');
  var head='<button type="button" class="row" data-a="mopen" style="min-height:48px;border:1px solid var(--field-line);border-radius:12px;padding:8px 14px;width:100%"><span class="grow"><b style="font-weight:600">'+esc(T('Payment method (optional)'))+'</b><small>'+esc(names||T('Not set'))+'</small></span>'+ic(I.chev,18)+'</button>';
  if(!open)return head;
  var h='<div class="field">'+esc(dir==='lent'?T('How did you lend the money?'):T('How did you receive the money?'))+'</div>';
  METHODS.forEach(function(g){
    h+='<small style="color:var(--muted);font-weight:600">'+esc(T(g.g))+'</small><div class="chips" style="flex-wrap:wrap;overflow:visible">'+g.i.map(function(it){return '<button type="button" class="chip" data-a="mtog" data-v="'+it[0]+'" aria-pressed="'+(sel.indexOf(it[0])>-1)+'">'+esc(it[1])+'</button>';}).join('')+'</div>';
  });
  return head+h;
}

var SHEETS={
  quick:function(){
    var q=function(a,ic_,t,v){return '<button type="button" data-a="'+a+'"'+(v?' data-v="'+v+'"':'')+'><span class="ci">'+ic(ic_,22)+'</span>'+esc(t)+'</button>';};
    return {title:T('Add a loan'),body:'<div class="qa">'+q('addLoan',I.wallet,T('I lent money'),'lent')+q('addLoan',I.download,T('I borrowed money'),'borrowed')+'</div>'};
  },
  loanForm:function(s){
    var l=s.id?find(db.loans,s.id):null, dir=F('f_dir','lent');
    var names=db.people.map(function(p){return '<option value="'+esc(p.name)+'">';}).join('');
    var body='<div class="form">'+(l?'':seg([{v:'lent',t:T('I lent')},{v:'borrowed',t:T('I borrowed')}],dir,'fDir'))+'<datalist id="ppl">'+names+'</datalist>'+
      fInput('f_name',dir==='lent'?T('Who did you lend to?'):T('Who lent you?'),{list:'ppl'})+fInput('f_phone',T('Phone (optional)'),{type:'tel',im:'tel'})+
      '<div class="grid2">'+fInput('f_amt',T('Amount (Birr)'),{im:'numeric'})+fInput('f_date',T('Date'),{type:'date',max:ymd(Date.now())})+'</div>'+
      fInput('f_due',T('Repayment date (optional)'),{type:'date'})+fInput('f_note',T('Note (optional)'),{ph:T('What was it for?')})+methodHtml(dir);
    return {title:l?T('Edit loan'):T('Add a loan'),body:body+errBox()+btn('loanSave',T('Save'),'primary')+'</div>'};
  },
  loan:function(s){
    var l=find(db.loans,s.id);if(!l)return null;var p=person(l.pid),tg=loanTag(l),b=balOf(l),lent=l.dir==='lent';
    var body=(tg?'<div class="tags">'+tag(tg.t,tg.k)+'</div>':'')+'<div>'+kv(T('Person'),'<button class="link" data-a="person" data-id="'+l.pid+'">'+esc(p.name)+'</button>')+kv(lent?T('You lent'):T('You borrowed'),'<b class="num">'+fmt(l.amount)+' Birr</b>')+kv(T('Paid back'),'<span class="num">'+fmt(paidOf(l))+'</span>')+kv(T('Balance'),'<b class="num">'+fmt(l.status==='open'?b:0)+'</b>')+kv(T('Date'),esc(fmtDate(l.ts)))+(l.note?kv(T('Note'),esc(l.note)):'')+'</div>';
    body+='<div class="form">';
    if(active(l))body+=btn('payOpen',lent?T('Record payment received'):T('Record payment made'),'primary',{id:l.id});
    return {title:p.name,body:body+btn('loanDel',T('Delete loan'),'danger',{id:l.id})+'</div>'};
  },
  pay:function(s){
    var l=find(db.loans,s.id);if(!l||!active(l))return null;
    return {title:T('Record a payment'),body:'<div class="form"><p class="sub">'+esc(person(l.pid).name)+' - '+esc(T('Balance'))+': <b class="num">'+fmt(balOf(l))+'</b></p>'+fInput('f_pay',T('Amount (Birr)'),{im:'numeric',def:String(balOf(l))})+errBox()+btn('paySave',T('Save payment'),'primary',{id:l.id})+'</div>'};
  },
  person:function(s){
    var p=find(db.people,s.id);if(!p)return null;var n=personNet(p.id);
    return {title:p.name,body:'<div class="sum"><div class="total"><span>'+esc(n>0?T('Owes you'):n<0?T('You owe'):T('Settled'))+'</span><b class="num">'+fmt(Math.abs(n))+' Birr</b></div></div>'+(p.phone?kv(T('Phone'),esc(p.phone)):'')+'<div class="form">'+btn('addLoanFor',T('Add loan'),'primary',{id:p.id})+'</div>'};
  },
  pin:function(){return {title:T('Set a PIN'),body:'<div class="form">'+fInput('f_p1',T('New 4-digit PIN'),{im:'numeric',ml:4,type:'password'})+fInput('f_p2',T('Repeat PIN'),{im:'numeric',ml:4,type:'password'})+errBox()+btn('pinSave',T('Save PIN'),'primary')+'</div>'};}
};

function renderSheet(){
  var root=$('#sheetRoot'),s=state.sheet;if(!s){root.innerHTML='';return;}
  var r=SHEETS[s.t]?SHEETS[s.t](s):null;if(!r){state.sheet=null;root.innerHTML='';return;}
  root.innerHTML='<div class="scrim" data-scrim="1"><div class="panel" role="dialog"><div class="head"><h2>'+esc(r.title)+'</h2><button type="button" class="iconbtn" data-a="closeSheet">'+ic(I.x,20)+'</button></div>'+r.body+'</div></div>';
}

function renderConf(){
  var root=$('#confRoot'),c=state.conf;if(!c){root.innerHTML='';return;}
  root.innerHTML='<div class="scrim center" data-scrim="1"><div class="panel" role="alertdialog"><h2>'+esc(c.title)+'</h2><div class="btns"><button type="button" class="btn" data-a="confNo">'+esc(T('Cancel'))+'</button><button type="button" class="btn dangerfill" data-a="confYes">'+esc(T('Confirm'))+'</button></div></div></div>';
}

function navHtml(){
  var b=function(t,icon,label){return '<button type="button" data-a="tab" data-v="'+t+'"'+(state.tab===t?' aria-current="page"':'')+'>'+ic(icon,22)+esc(label)+'</button>';};
  return b('home',I.home,T('Home'))+b('people',I.users,T('People'))+'<button type="button" class="mid" data-a="quick"><span class="disc">'+ic(I.plus,26,2.2)+'</span></button>'+b('activity',I.clock,T('Activity'))+b('settings',I.gear,T('Settings'));
}

function render(){
  var top=state.pages[state.pages.length-1];
  var html=state.locked?viewLock():top==='alerts'?viewAlerts():(top&&top.indexOf('set:')===0)?viewSetPage(top.slice(4)):state.tab==='home'?viewHome():state.tab==='people'?viewPeople():state.tab==='activity'?viewActivityTab():viewSettings();
  $('#app').innerHTML=html;
  $('#nav').hidden=state.locked||!!top; if(!state.locked&&!top)$('#navIn').innerHTML=navHtml();
  renderSheet(); renderConf();
  document.documentElement.style.overflow=(state.sheet||state.conf)?'hidden':'';
}

function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true;},2600);}
function showErr(m){var e=$('#sheetErr');if(!e){toast(m);return false;}e.textContent=m;e.hidden=false;return false;}
function ask(o){state.conf=o;render();}

function act(a,el){
  var id=el.getAttribute('data-id'),v=el.getAttribute('data-v'),l=id?find(db.loans,id):null;
  switch(a){
    case 'tab':state.tab=v;state.pages=[];state.sheet=null;break;
    case 'quick':state.sheet={t:'quick'};break;
    case 'closeSheet':state.sheet=null;break;
    case 'confNo':state.conf=null;break;
    case 'confYes':var fn=state.conf&&state.conf.fn;state.conf=null;if(fn)fn();break;
    case 'side':state.side=v;break;
    case 'filter':state.filter=v;break;
    case 'addLoan':state.sheet={t:'loanForm'};state.f={f_dir:v,f_date:ymd(Date.now())};break;
    case 'fDir':state.f.f_dir=v;break;
    case 'mopen':state.f.f_mopen=state.f.f_mopen==='1'?'':'1';break;
    case 'mtog':var cs=mSel(),ix=cs.indexOf(v);if(ix>-1)cs.splice(ix,1);else cs.push(v);state.f.f_meth=cs.join(',');break;
    case 'loanSave':
      var name=(state.f.f_name||'').trim(),amt=num(state.f.f_amt);
      if(!name)return showErr(T('Enter a name'));if(!amt)return showErr(T('Enter an amount'));
      var pe=find(db.people,name)||(function(){var x={id:uid(),name:name,phone:state.f.f_phone||''};db.people.push(x);return x;})();
      db.loans.push({id:uid(),dir:state.f.f_dir||'lent',pid:pe.id,amount:amt,ts:Date.now(),due:fromYmd(state.f.f_due),note:state.f.f_note||'',status:'open',payments:[]});
      log('Loan saved: {n} {a} Birr',{n:name,a:fmt(amt)});save();state.sheet=null;toast(T('Loan saved'));break;
    case 'loan':state.sheet={t:'loan',id:id};break;
    case 'payOpen':state.sheet={t:'pay',id:id};state.f={};break;
    case 'paySave':
      var pamt=num(state.f.f_pay);if(!pamt)return showErr(T('Enter an amount'));
      l.payments.push({id:uid(),ts:Date.now(),amount:pamt});log('Payment of {a} Birr',{a:fmt(pamt)});save();state.sheet=null;toast(T('Payment saved'));break;
    case 'loanDel':ask({title:T('Delete loan?'),fn:function(){db.loans=db.loans.filter(function(x){return x.id!==id;});save();state.sheet=null;toast(T('Deleted'));}});break;
    case 'ptab':state.ptab=v;break;
    case 'setp':state.pages.push('set:'+v);break;
    case 'actf':state.actFilter=v;break;
    case 'mode':db.settings.mode=v;save();applyTheme();break;
    case 'palette':db.settings.palette=v;save();applyTheme();break;
    case 'size':db.settings.textSize=v;save();applyTheme();break;
    case 'rlang':db.settings.remindLang=v;save();break;
    case 'pinSet':state.sheet={t:'pin'};break;
    case 'backup':
      var b=new Blob([JSON.stringify(db)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
      a.href=u;a.download='amanah-backup.json';a.click();break;
    case 'resetAll':ask({title:T('Erase everything?'),fn:function(){db=emptyDb();save();render();}});break;
    case 'alerts':state.pages.push('alerts');break;
    case 'back':state.pages.pop();break;
  }
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;act(el.getAttribute('data-a'),el);render();
});
document.addEventListener('input',function(e){
  if(e.target.hasAttribute('data-f'))state.f[e.target.id]=e.target.value;
  if(e.target.id==='q'){state.q=e.target.value;$('#list').innerHTML=loanList();}
  if(e.target.id==='pq'){state.pq=e.target.value;$('#plist').innerHTML=peopleList();}
});

db=load();if(!db){db=seed();save();}
applyTheme();
render();
})();
</script>
</body>
</html>
