<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Amanah</title><meta name="theme-color" content="#1B1B1D">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Amanah">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap">
<style>
/* Shop Stock styles. Colors come from CSS variables that the app sets from the chosen mode and palette. */
:root{
  --font:'Unbounded','Noto Sans Ethiopic','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#566275; --line:#E1E6EC;
  --field-line:#8793A6; --accent:#0E7C66; --accent-ink:#FFFFFF; --accent-soft:#E2F3EE;
  --hero:#0F1B2D; --hero-ink:#FFFFFF; --hero-muted:#A9B6C6; --hero-line:#2B3A52;
  --bad:#B42318; --bad-bg:#FDE7E5; --warn:#7A4100; --warn-bg:#FFEBCF; --good:#0B6150; --good-bg:#E2F3EE;
  --seg:#E3E8EE; --scrim:rgba(15,27,45,.5);
  --gA-bg:#0B6150; --gA-fg:#FFFFFF; --gB-bg:#BFE6DA; --gB-fg:#0B3D33; --gC-bg:#FFE3A3; --gC-fg:#5C3B00;
  --gD-bg:#F4B58A; --gD-fg:#4A2000; --gE-bg:#D5DAE1; --gE-fg:#243044;
}
*{box-sizing:border-box}
html{color-scheme:light}
html[data-mode="dark"]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) 112px;-webkit-text-size-adjust:100%}
html[data-size="large"] body{zoom:1.14}
body.nonav{padding-bottom:40px}
#app{max-width:480px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
small{font-size:13px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top h1{font-size:24px;font-weight:800;letter-spacing:-.2px;overflow-wrap:anywhere}
.top .acts{display:flex;gap:8px;flex:none}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.pagehead{display:flex;align-items:center;gap:12px}
.pagehead h1{font-size:22px;font-weight:800;flex:1;min-width:0;overflow-wrap:anywhere}
.iconbtn{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;position:relative}
.iconbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
[data-mode="dark"] .badge{color:#1A0505}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.card.flush{padding-block:4px}
.card h3{font-size:16px;font-weight:700;margin-bottom:8px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.cardhead h3{margin:0}
.link{min-height:44px;padding:0 4px;border:none;background:transparent;color:var(--accent);font-weight:700;font-size:14px}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px;border:none;width:100%;text-align:left;font:inherit}
button.hero{cursor:pointer}
.hero .label{font-size:13px;color:var(--hero-muted)}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.5px;margin-top:4px}
.hero .big span{font-size:15px;font-weight:600;color:var(--hero-muted);margin-left:6px}
.hero .toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hero .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border-top:1px solid var(--hero-line);padding-top:14px}
.hero .stats b{display:block;font-size:16px;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:block;width:100%;color:var(--ink)}
.tile b{display:block;font-size:26px;font-weight:800}
.tile span{font-size:13px;color:var(--muted)}
.tiles2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.btn{min-height:48px;border-radius:14px;border:1px solid var(--field-line);background:var(--surface);color:var(--ink);font-weight:700;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.armed,.btn.dangerfill{background:var(--bad);color:#fff;border-color:var(--bad)}
[data-mode="dark"] .btn.armed,[data-mode="dark"] .btn.dangerfill{color:#1A0505}
.btn.sm{min-height:44px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.btns{display:flex;gap:12px}
.btns>*{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;min-width:44px;padding:0 16px;border-radius:999px;border:1px solid var(--field-line);background:var(--surface);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--seg)}
.seg button{flex:1;min-height:44px;border-radius:12px;border:none;background:transparent;font-weight:700;font-size:14px;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{display:flex;align-items:center;gap:10px;min-height:48px;border-radius:14px;border:1px solid var(--field-line);background:var(--surface);padding:0 14px;color:var(--muted)}
.search input{flex:1;min-width:0;border:none;background:transparent;outline:none;min-height:46px;color:var(--ink)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border:none;border-bottom:1px solid var(--line);background:transparent;text-align:left;min-height:64px;color:var(--ink)}
.row:last-child{border-bottom:none}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .grow b{font-weight:700;overflow-wrap:anywhere}
.row .end{text-align:right;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.row .end b{font-weight:800}
.row.off{opacity:.6}
.row.off .grow b{text-decoration:line-through}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.good{background:var(--good-bg);color:var(--good)}
.tag.info{background:var(--accent-soft);color:var(--accent)}
.tag.gray{background:var(--seg);color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.grade{flex:none;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.gA{background:var(--gA-bg);color:var(--gA-fg)}.gB{background:var(--gB-bg);color:var(--gB-fg)}.gC{background:var(--gC-bg);color:var(--gC-fg)}
.gD{background:var(--gD-bg);color:var(--gD-fg)}.gE{background:var(--gE-bg);color:var(--gE-fg)}
.stockn{font-size:22px;font-weight:800}
.banner{display:flex;align-items:center;gap:12px;background:var(--warn-bg);color:var(--warn);border-radius:16px;padding:12px 14px;font-size:13px}
.banner span{flex:1}
.banner button{flex:none;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid currentColor;background:transparent;font-weight:700;color:inherit}
.okbox{background:var(--good-bg);color:var(--good);border-radius:16px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.okbox span{flex:1}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--field-line);background:var(--surface);padding:0 14px;font-size:16px;color:var(--ink)}
.field textarea{padding:12px 14px;min-height:96px;resize:vertical}
.field small{font-weight:500}
.field.err input,.field.err textarea{border-color:var(--bad)}
.form{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.facts div small{display:block}
.facts div b{display:block;margin-top:2px;overflow-wrap:anywhere}
.sum{display:flex;flex-direction:column;gap:10px}
.sum .l{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.sum .l span:first-child{color:var(--muted)}
.sum .total{border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sum .total b{font-size:28px;font-weight:800;color:var(--accent)}
.sum .total b.out{color:var(--warn)}
.steps{display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.4}
.steps div{display:flex;gap:10px;align-items:flex-start}
.steps svg{flex:none;margin-top:1px;color:var(--good)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.scrim.center{align-items:center;padding:16px;z-index:50}
.panel{width:100%;max-width:480px;max-height:92%;overflow-y:auto;background:var(--surface);color:var(--ink);border-radius:24px 24px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;outline:none}
.scrim.center .panel{border-radius:24px;max-height:86%}
.panel .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel h2{font-size:20px;font-weight:800;overflow-wrap:anywhere}
.divider{border:none;border-top:1px solid var(--line);margin:2px 0;width:100%}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:480px;margin-inline:auto;display:flex;justify-content:space-around;align-items:flex-start}
.nav button{width:66px;min-height:56px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);padding:0}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.nav .mid{margin-top:-26px}
.nav .mid .disc{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.28)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}
.catgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.catcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:112px;color:var(--ink)}
.catcard .ci{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.catcard b{font-size:16px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--field-line);background:var(--surface);font-size:20px;font-weight:700;line-height:1;padding:0}
.stepper b{min-width:28px;text-align:center}
.unitlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;max-height:260px;overflow-y:auto}
.unit{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 12px;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.unit:last-child{border-bottom:none}
.unit input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.unit[hidden]{display:none}
.unit.taken{opacity:.5}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 2px;font-size:13px;font-weight:700;color:var(--muted)}
.cartline{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.cartline:last-child{border-bottom:none}
.cartline .top2{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cartline .top2 b{overflow-wrap:anywhere}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.kv span:first-child{color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.swatch{border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;color:var(--ink);min-height:44px}
.swatch[aria-pressed="true"]{border-color:var(--accent)}
.swatch .dots{display:flex;gap:4px}
.swatch .dots i{width:22px;height:22px;border-radius:50%;display:block;border:1px solid rgba(128,128,128,.4)}
.swatch span{font-size:13px;font-weight:700}
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.qa button{min-height:76px;border-radius:18px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;padding:12px 14px;font-weight:700;color:var(--ink);text-align:left}
.qa button .ci{color:var(--accent)}
.menulist{display:flex;flex-direction:column}
.menulist button{display:flex;align-items:center;gap:14px;min-height:60px;border:none;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%;padding:8px 0;color:var(--ink)}
.menulist button:last-child{border-bottom:none}
.menulist .ci{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.menulist .grow{flex:1;min-width:0}
.menulist b{display:block}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:none}
.alert .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px}
.alert .dot.bad{background:var(--bad)}.alert .dot.warn{background:#D98A00}.alert .dot.info{background:var(--accent)}
.alert .grow{flex:1;min-width:0}
.alert .grow b{display:block}
.alert .acts{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.alert .acts button{min-height:44px;padding:0 10px;border:none;background:transparent;color:var(--accent);font-weight:700;font-size:14px}
.alert .acts button.muted{color:var(--muted);font-weight:600}
.lockbox{min-height:60vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;overflow-wrap:anywhere}
.rcpt{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;overflow-wrap:anywhere}
.progress{height:8px;border-radius:4px;background:var(--seg);overflow:hidden}
.progress i{display:block;height:8px;background:var(--accent)}
@media (prefers-reduced-motion: no-preference){.panel{animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:320px;width:100%;margin-inline:auto}
.pad button{min-height:64px;border-radius:18px;font-size:24px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.dots{display:flex;gap:14px;justify-content:center}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);display:block}
.dots i.on{background:var(--accent)}
/* v2 look: monochrome, Vercel/Linear base, Revolut numbers */
body{background-image:linear-gradient(rgba(128,128,128,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(128,128,128,.07) 1px,transparent 1px);background-size:48px 48px}

.hero{border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 24px 50px rgba(0,0,0,.35);border-radius:22px}
html:not([data-mode="dark"]) .hero{box-shadow:0 18px 40px rgba(0,0,0,.18)}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.hero .label{letter-spacing:.02em}
h1,h2,h3{letter-spacing:-.025em}
.card,.row,.item{border-radius:16px}
.num{font-weight:600;letter-spacing:-.02em}

/* v3: MacroFactor-inspired Bento Grid Layout */
body{background-color:var(--bg)}
body{background-image:none}
.card,.flush{border-radius:22px}
.bento-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  width: 100%;
}
.bento-card {
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 24px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
}
.bento-card.span-2 {
  grid-column: span 2;
}
.bento-card .card-label {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
}
.ring{position:relative;width:80px;height:80px;flex:none}.ring svg{width:100%;height:100%}
.rt,.rf{fill:none;stroke-width:10}.rt{stroke:var(--seg)}.rf{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.dot.g,.bar u.g{background:var(--lent)}.dot.o,.bar u.o{background:var(--owe)}
.tl{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.ta{fill:var(--accent);opacity:.12}

/* v4: charcoal + wide headings + custom colors */
.top h1{font-family:'Unbounded','Inter',sans-serif;text-transform:uppercase;font-weight:700;font-size:22px;letter-spacing:-.01em}
.card,.flush{border:1.5px solid var(--line);box-shadow:none}
.cpick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cpick label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.cpick input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:3px}
html[data-mode="dark"] .banner{background:var(--seg);color:var(--ink)}
html[data-mode="dark"] .fab,html[data-mode="dark"] .tab.add .plus{background:#fff;color:#111}
body{font-size:13px;letter-spacing:-.005em}
.top h1{font-size:22px}.pagehead h1{font-size:19px}.card h3{font-size:14px}
.chip{font-size:12px}.field input,.field select,.field textarea{font-size:14px}
.hero .big span{font-size:13px}.hero .stats b{font-size:15px}.tile b{font-size:22px}.panel h2{font-size:17px}
.btn,button{font-family:inherit}
input,textarea,select,button{font-family:inherit}

/* activity tab */
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.daterow{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}

/* ---------- loan maths ---------- */
var paidOf=function(l){return sum(l.payments,function(p){return p.amount;});};
var balOf=function(l){return Math.max(0,l.amount-paidOf(l));};
var active=function(l){return l.status==='open'&&balOf(l)>0;};
var person=function(id){return find(db.people,id)||{name:'?',phone:''};};
function dueIn(l){if(!active(l)||!l.due)return null;return Math.round((startOfDay(l.due)-startOfDay(Date.now()))/DAY);}
function totals(){var a=0,b=0;db.loans.forEach(function(l){if(!active(l))return;if(l.dir==='lent')a+=balOf(l);else b+=balOf(l);});return {lent:a,owe:b};}
function loanTag(l){
  if(l.status==='forgiven')return {t:T('Forgiven'),k:'gray'};if(l.status==='gift')return {t:T('Gift'),k:'gray'};
  if(balOf(l)<=0)return {t:T('Settled'),k:'good'};
  var d=dueIn(l);if(d==null)return null;
  if(d<0)return {t:T('Overdue {n} days',{n:-d}),k:'bad'};if(d===0)return {t:T('Due today'),k:'warn'};if(d<=3)return {t:T('Due in {n} days',{n:d}),k:'warn'};
  return {t:T('Due {d}',{d:fmtDate(l.due)}),k:'gray'};
}
function alerts(){
  var out=[];
  db.loans.forEach(function(l){
    var d=dueIn(l);if(d==null||d>3)return;var nm=person(l.pid).name,a=fmt(balOf(l));
    out.push({id:l.id,d:d,sev:d<0?'bad':'warn',t:l.dir==='lent'?T('{n} owes you {a} Birr',{n:nm,a:a}):T('You owe {n} {a} Birr',{n:nm,a:a}),s:d<0?T('Overdue by {n} days',{n:-d}):d===0?T('Due today'):T('Due in {n} days',{n:d})});
  });
  return out.sort(function(a,b){return a.d-b.d;});
}
function personNet(pid){var n=0;db.loans.forEach(function(l){if(l.pid===pid&&active(l))n+=l.dir==='lent'?balOf(l):-balOf(l);});return n;}

/* ---------- screens ---------- */
function loanRow(l){
  var p=person(l.pid),tg=loanTag(l),b=balOf(l),pc=paidOf(l);
  return '<button class="row" data-a="loan" data-id="'+l.id+'">'+avatar(p.name)+'<span class="grow"><b>'+esc(p.name)+'</b><small>'+esc(l.note||fmtDate(l.ts))+'</small>'+(tg?'<span class="tags">'+tag(tg.t,tg.k)+'</span>':'')+
    (pc>0&&b>0?'<span class="progress" style="margin-top:6px"><i style="width:'+Math.min(100,Math.round(pc/l.amount*100))+'%"></i></span>':'')+'</span><span class="end"><b class="num">'+fmt(b>0&&l.status==='open'?b:l.amount)+'</b><small>'+(pc>0&&b>0?esc(T('of {n}',{n:fmt(l.amount)})):esc(T('Birr')))+'</small></span></button>';
}
function loanList(){
  var q=state.q.trim().toLowerCase(),f=state.filter;
  var list=db.loans.filter(function(l){
    if(l.dir!==state.side)return false;var d=dueIn(l);
    if(f==='all'&&!active(l))return false;
    if(f==='overdue'&&!(d!=null&&d<0))return false;
    if(f==='soon'&&!(d!=null&&d>=0&&d<=7))return false;
    if(f==='done'&&active(l))return false;
    if(q&&(person(l.pid).name+' '+(l.note||'')).toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){var da=dueIn(a),db_=dueIn(b);if(da==null&&db_==null)return b.ts-a.ts;if(da==null)return 1;if(db_==null)return -1;return da-db_;});
  return list.length?list.map(loanRow).join(''):empty(f==='done'?T('Nothing settled yet.'):T('Nothing here. Tap + to add a loan.'));
}

/* NEW BENTO GRID HERO UI */
function heroHtml(t){
  var tot=0,pd=0;db.loans.forEach(function(l){if(l.dir==='lent'&&l.status==='open'){tot+=l.amount;pd+=paidOf(l);}});
  var pct=tot?Math.round(pd/tot*100):0,R=38,C=2*Math.PI*R,off=C*(1-pct/100);
  var mx=Math.max(t.lent,t.owe,1),now=Date.now(),pts=[],i;
  for(i=7;i>=0;i--){var at=now-i*7*864e5,v=0;db.loans.forEach(function(l){if(l.status!=='open'||l.ts>at)return;var p=0;l.payments.forEach(function(x){if(x.ts<=at)p+=x.amount;});v+=(l.dir==='lent'?1:-1)*Math.max(0,l.amount-p);});pts.push(v);}
  var lo=Math.min.apply(0,pts),hi=Math.max.apply(0,pts),rg=(hi-lo)||1,W=300,H=44,d=pts.map(function(v,k){return (k?'L':'M')+(k*W/7).toFixed(1)+' '+(H-4-(v-lo)/rg*(H-8)).toFixed(1);}).join(' ');
  
  return '<div class="bento-grid">' +
    '<div class="bento-card" style="align-items:center;justify-content:center;text-align:center;padding:16px;">' +
      '<div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="'+R+'" class="rt"/><circle cx="60" cy="60" r="'+R+'" class="rf" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 60 60)"/></svg><div class="rc"><b style="font-size:18px">'+pct+'%</b></div></div>' +
      '<span style="font-size:11px;font-weight:600;color:var(--muted);margin-top:4px;">'+esc(T('repaid'))+'</span>' +
    '</div>' +

    '<div style="display:flex;flex-direction:column;gap:12px;">' +
      '<div class="bento-card" style="padding:12px 14px;">' +
        '<div class="card-label"><i class="dot g" style="margin-right:6px"></i>'+esc(T('People owe you'))+'</div>' +
        '<b class="num" style="font-size:18px;font-weight:800;color:var(--lent);">'+fmt(t.lent)+'</b>' +
      '</div>' +
      '<div class="bento-card" style="padding:12px 14px;">' +
        '<div class="card-label"><i class="dot o" style="margin-right:6px"></i>'+esc(T('You owe'))+'</div>' +
        '<b class="num" style="font-size:18px;font-weight:800;color:var(--owe);">'+fmt(t.owe)+'</b>' +
      '</div>' +
    '</div>' +

    '<div class="bento-card span-2">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">' +
        '<div class="card-label" style="margin-bottom:0;">'+esc(T('Net position'))+'</div>' +
        '<b class="num" style="font-size:15px;font-weight:800;">'+(t.lent-t.owe>=0?'+':'-')+fmt(Math.abs(t.lent-t.owe))+' '+esc(T('Birr'))+'</b>' +
      '</div>' +
      '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true" style="width:100%;height:44px;display:block;"><path d="'+d+' L'+W+' '+H+' L0 '+H+'Z" class="ta"/><path d="'+d+'" class="tl"/></svg>' +
      '<div style="display:flex;justify-content:space-between;margin-top:4px;"><small style="font-size:11px;">'+esc(T('Last 8 weeks'))+'</small></div>' +
    '</div>' +
  '</div>';
}

    return t==='owes'?sideBal(p.id,'lent')>0:t==='owe'?sideBal(p.id,'borrowed')>0:true;
  }).map(function(p){var a=t==='owes'?sideBal(p.id,'lent'):t==='owe'?sideBal(p.id,'borrowed'):personNet(p.id);return {p:p,n:a,k:Math.abs(a)};})
  .sort(function(a,b){return b.k-a.k;}).map(function(r){
    var p=r.p,n=r.n;

function actRange(){
  var t=startOfDay(Date.now()),f=state.actFilter,s,e;
  if(f==='all')return {};
  if(f==='today')return {s:t,e:addDays(t,1)};
  if(f==='yesterday')return {s:addDays(t,-1),e:t};
  if(f==='date'){s=fromYmd(state.actDate);return s?{s:s,e:addDays(s,1)}:{bad:1};}
  s=fromYmd(state.actFrom);e=fromYmd(state.actTo);
  if(!s||!e)return {bad:1};
  if(s>e){var x=s;s=e;e=x;}
  return {s:s,e:addDays(e,1)};
}
function actBody(){
  var r=actRange(),f=state.actFilter;
  if(r.bad)return empty(f==='date'?T('Pick a date to see what happened.'):T('Pick both dates to see what happened.'));
  var l=db.activity.filter(function(a){return r.s==null||(a.ts>=r.s&&a.ts<r.e);}).sort(function(a,b){return b.ts-a.ts;});
  var h='<p class="sub">'+esc(l.length===1?T('{n} activity',{n:1}):T('{n} activities',{n:l.length}))+'</p>';
  if(!l.length){
    return h+empty(f==='today'?T('Nothing happened today.'):f==='yesterday'?T('Nothing happened yesterday.'):f==='date'?T('Nothing happened on this day.'):f==='range'?T('Nothing happened in this period.'):T('Nothing recorded yet.'));
  }
  var t0=startOfDay(Date.now()),y0=addDays(t0,-1),cur=-1;
  l.forEach(function(a){
    var d=startOfDay(a.ts);
    if(d!==cur){
      if(cur!==-1)h+='</section>';
      cur=d;
      h+='<p class="daygroup">'+esc(d===t0?T('Today'):d===y0?T('Yesterday'):fmtDate(d))+'</p><section class="card flush">';
    }
    h+='<div class="row" style="min-height:52px"><span class="grow"><b style="font-weight:600">'+esc(T(a.k,a.v))+'</b><small>'+esc(fmtTime(a.ts))+'</small></span></div>';
  });
  return h+'</section>';
}

var histN=0,histIgnore=0;

function syncHist(){
  if(histIgnore>0||state.locked)return;var d=depth();
  try{if(d>histN){while(histN<d){histN++;history.pushState({d:histN},'');}}else if(d<histN){var n=histN-d;histN=d;histIgnore++;history.go(-n);}}catch(e){}

    case 'restore':return restoreFrom(String(state.f.bk_in||'').trim());
    case 'pickBackup':$('#bk_file').click();return false;
    case 'clearDemo':ask({title:T('Remove the example data?'),msg:T('Your own entries stay.'),ok:T('Remove'),danger:true,fn:function(){var k=function(x){return !x.demo;};db.people=db.people.filter(k);db.loans=db.loans.filter(k);db.activity=db.activity.filter(k);db.demo=false;save();toast(T('Example data removed'));}});return false;
    case 'resetAll':ask({title:T('Erase everything?'),msg:T('All loans and people on this phone will be deleted. Make a backup first.'),ok:T('Erase'),danger:true,fn:function(){var s=db.settings;db=emptyDb();db.settings=s;save();state.tab='home';state.pages=[];toast(T('Everything erased'));}});return false;
    default:return false;
  }
}
function copyText(t,m){var ok=function(){toast(m||T('Copied'));},fb=function(){var a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');ok();}catch(e){toast(T('Could not copy'));}document.body.removeChild(a);};try{navigator.clipboard.writeText(t).then(ok,fb);}catch(e){fb();}}
function download(name,text,mime){try{var b=new Blob([text],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u);},4000);return true;}catch(e){toast(T('Could not save the file.'));return false;}}
/* ---------- payment methods ---------- */
var METHODS=[{g:'Cash',i:[['cash','Cash']]},{g:'Mobile wallets',i:[['telebirr','Telebirr'],['mpesa','M-Pesa'],['cbebirr','CBE Birr']]},{g:'Banks',i:[['cbe','CBE'],['abyssinia','Bank of Abyssinia']]},{g:'Other',i:[['other','Other']]}];
function mName(x){if(x.m==='other')return x.label||T('Other');for(var g=0;g<METHODS.length;g++)for(var k=0;k<METHODS[g].i.length;k++)if(METHODS[g].i[k][0]===x.m)return METHODS[g].i[k][1];return x.m;}
function mSel(){var v=F('f_meth');return v?v.split(','):[];}
function mAllocLine(){
  var sel=mSel();if(sel.length<2)return '';
  var a=0;sel.forEach(function(k){a+=num(F('f_ma_'+k));});var tot=num(F('f_amt')),ok=tot>0&&a===tot;
  return '<p class="sub" id="mAlloc" style="color:'+(ok?'var(--good)':'var(--bad)')+'">'+esc(T('Allocated {a} of {t} Birr',{a:fmt(a),t:fmt(tot)}))+'</p>';
}
function methodHtml(dir){
  var sel=mSel(),open=F('f_mopen')==='1',names=sel.map(function(k){return mName({m:k,label:F('f_mo')});}).join(', ');
  var head='<button type="button" class="row" data-a="mopen" style="min-height:52px;border:1px solid var(--field-line);border-radius:14px;padding:8px 14px;width:100%"><span class="grow"><b style="font-weight:600">'+esc(T('Payment method (optional)'))+'</b><small>'+esc(names||T('Not set'))+'</small></span>'+ic(I.chev,18)+'</button>';
  if(!open)return head;
  var h='<div class="field">'+esc(dir==='lent'?T('How did you lend the money?'):T('How did you receive the money?'))+'</div>';
  METHODS.forEach(function(g){
    h+='<small style="color:var(--muted);font-weight:600">'+esc(T(g.g))+'</small><div class="chips" style="flex-wrap:wrap;overflow:visible">'+g.i.map(function(it){return '<button type="button" class="chip" data-a="mtog" data-v="'+it[0]+'" aria-pressed="'+(sel.indexOf(it[0])>-1)+'">'+esc(it[1])+'</button>';}).join('')+'</div>';
  });
  if(sel.indexOf('other')>-1)h+=fInput('f_mo',T('Name of the other method'),{ml:30});
  if(sel.length>1){h+='<div class="field">'+esc(T('Amount through each method (Birr)'))+'</div>';sel.forEach(function(k){h+=fInput('f_ma_'+k,mName({m:k,label:F('f_mo')}),{im:'numeric'});});h+=mAllocLine();}
  return head+h;
}
function methodsFromForm(amt){
  var sel=mSel(),out=[];
  sel.forEach(function(k){var x={m:k,amt:sel.length===1?amt:num(F('f_ma_'+k))};if(k==='other')x.label=(F('f_mo')||'').trim();out.push(x);});
  return out;
}
function methodsToForm(l){
  var f={f_meth:(l.methods||[]).map(function(x){return x.m;}).join(',')};
  (l.methods||[]).forEach(function(x){f['f_ma_'+x.m]=String(x.amt||'');if(x.m==='other')f.f_mo=x.label||'';});
  return f;
}
function loansCsv(){
  var q=function(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;},rows=[['Date','Type','Person','Phone','Amount','Paid','Balance','Repayment date','Status','Note','Payment method']];
  db.loans.slice().sort(function(a,b){return a.ts-b.ts;}).forEach(function(l){var p=person(l.pid);rows.push([ymd(l.ts),l.dir==='lent'?'Lent':'Borrowed',p.name,p.phone,l.amount,paidOf(l),balOf(l),l.due?ymd(l.due):'',l.status,l.note,(l.methods||[]).map(function(x){return mName(x)+(l.methods.length>1?' '+x.amt:'');}).join(' + ')]);});
  return '﻿'+rows.map(function(r){return r.map(q).join(',');}).join('\r\n');
}
function restoreFrom(text){
  var o=null;try{o=JSON.parse(text);}catch(e){}
  if(!o||!Array.isArray(o.loans)||!Array.isArray(o.people))return showErr(T('That is not a valid backup.'));
  ask({title:T('Restore this backup?'),msg:T('This replaces everything on this phone: {n} loans.',{n:o.loans.length}),ok:T('Yes, restore'),danger:true,fn:function(){o.settings=Object.assign(defaults(),o.settings||{});if(o.settings.ui!==3){o.settings.ui=3;o.settings.palette='violet';o.settings.mode='dark';o.settings.bgStyle='charcoal';}o.activity=o.activity||[];db=o;save();applyTheme();toast(T('Backup restored'));}});
}
document.addEventListener('click',function(e){
  var t=e.target;if(t.hasAttribute&&t.hasAttribute('data-scrim')){if(state.conf)state.conf=null;else state.sheet=upSheet();render();return;}
  var el=t.closest?t.closest('[data-a]'):null;if(!el||el.disabled)return;var r;
  try{r=act(el.getAttribute('data-a'),el);}catch(err){console.error(err);toast(T('Something went wrong. Please try again.'));return;}
  if(r!==false)render();
});
document.addEventListener('input',function(e){
  var el=e.target;if(el.hasAttribute('data-f'))state.f[el.id]=el.value;
  if(el.id&&(el.id.indexOf('f_ma_')===0||el.id==='f_amt')){var al=$('#mAlloc');if(al){var tmp=document.createElement('div');tmp.innerHTML=mAllocLine();if(tmp.firstChild){al.textContent=tmp.firstChild.textContent;al.style.color=tmp.firstChild.style.color;}}}
  if(el.getAttribute('data-live')==='list'){state.q=el.value;$('#list').innerHTML=loanList();}
  if(el.getAttribute('data-live')==='plist'){state.pq=el.value;$('#plist').innerHTML=peopleList();}
});
document.addEventListener('change',function(e){
  var el=e.target;if(el.id==='bk_file'){var f=el.files&&el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){restoreFrom(String(r.result||''));el.value='';};r.readAsText(f);}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.tagName==='INPUT'&&e.target.closest&&e.target.closest('#sheetRoot')){
    var all=[].slice.call(document.querySelectorAll('#sheetRoot input:not([type=hidden]):not([type=file]):not([type=color]):not([type=date]),#sheetRoot textarea')),i=all.indexOf(e.target);
    e.preventDefault();if(i>-1&&i<all.length-1)all[i+1].focus();else e.target.blur();return;
  }if(e.key==='Escape'){if(state.conf)state.conf=null;else if(state.sheet)state.sheet=upSheet();else return;render();}});
var hiddenAt=0;
document.addEventListener('visibilitychange',function(){
  if(document.hidden){hiddenAt=Date.now();return;}
  if(db.settings.pin&&hiddenAt&&Date.now()-hiddenAt>60000&&!state.locked){state.locked=true;state.pin='';state.sheet=null;state.conf=null;render();}
});

/* ---------- start ---------- */
db=load();if(!db){db=seed();save();}
state.locked=!!db.settings.pin;
applyTheme();
try{history.replaceState({d:0},'');}catch(e){}
try{var mq=matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',function(){if(db.settings.mode==='auto'){applyTheme();render();}});}catch(e){}
render();
addEventListener('input',function(e){var c=e.target&&e.target.getAttribute&&e.target.getAttribute('data-col');if(c){db.settings[c]=e.target.value;save();applyTheme();}});
addEventListener('beforeinstallprompt',function(e){e.preventDefault();});
if(window.__SW__){try{if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}catch(e){}}
function actDateEv(e){
  var t=e.target,k=t&&t.getAttribute?t.getAttribute('data-act'):null;
  if(k!=='actDate'&&k!=='actFrom'&&k!=='actTo')return;
  state[k]=t.value;
  var b=$('#actBody');if(b)b.innerHTML=actBody();
}
document.addEventListener('input',actDateEv);
document.addEventListener('change',actDateEv);

})();
</script></body></html>
