<style>
/* ==========================================================================
   MACROFACTOR DARK THEME & BENTO GRID SYSTEM
   ========================================================================== */
:root {
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --bg: #0D0D0E;
  --surface: #18181A;
  --surface-elevated: #222225;
  --ink: #FFFFFF;
  --muted: #8E8E93;
  --line: #27272A;
  --field-line: #3F3F46;
  --accent: #0E7C66;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(14, 124, 102, 0.2);
  --hero: #18181A;
  --hero-ink: #FFFFFF;
  --hero-muted: #8E8E93;
  --hero-line: #27272A;
  --bad: #FF5252;
  --bad-bg: rgba(255, 82, 82, 0.15);
  --warn: #FFB300;
  --warn-bg: rgba(255, 179, 0, 0.15);
  --good: #4CAF50;
  --good-bg: rgba(76, 175, 80, 0.15);
  --seg: #222225;
  --scrim: rgba(0, 0, 0, 0.75);
  --lent: #6EA8FE;
  --owe: #FF8A5B;
}

* { box-sizing: border-box; }
html { color-scheme: dark; background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.4;
  padding-inline: 16px;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) 112px;
  -webkit-text-size-adjust: 100%;
}
body.nonav { padding-bottom: 40px; }
#app { max-width: 480px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3, p { margin: 0; letter-spacing: -0.02em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
small { font-size: 12px; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: -0.01em; }

/* Header */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.top h1 { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: -0.02em; }
.top .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.top .acts { display: flex; gap: 8px; flex: none; }

.pagehead { display: flex; align-items: center; gap: 12px; }
.pagehead h1 { font-size: 19px; font-weight: 800; flex: 1; min-width: 0; }

.iconbtn {
  flex: none; width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  display: flex; align-items: center; justify-content: center; padding: 0; position: relative;
}
.iconbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.badge {
  position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px;
  border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; padding: 0 4px;
}

/* Bento Grid System */
.bento-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%; }
.bento-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  padding: 16px; display: flex; flex-direction: column; justify-content: space-between;
  position: relative; overflow: hidden;
}
.bento-card.span-2 { grid-column: span 2; }
.bento-card .card-label {
  font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.05em; margin-bottom: 8px; display: flex; align-items: center;
}

/* Fixed Repayment Progress Ring */
.ring-container {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 100%; height: 100%; min-height: 110px;
}
.ring { position: relative; width: 84px; height: 84px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.rt { fill: none; stroke: var(--line); stroke-width: 8; }
.rf { fill: none; stroke: var(--lent); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; }
.rc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.rc b { font-size: 18px; font-weight: 800; color: var(--ink); line-height: 1; }
.rc span { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; margin-top: 4px; }

/* Fixed Sparkline Graph */
.sparkline-container { width: 100%; height: 48px; margin-top: 6px; }
.sparkline-svg { width: 100%; height: 100%; display: block; overflow: visible; }
.tl { fill: none; stroke: var(--lent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.ta { fill: url(#sparkline-grad); opacity: 0.3; }

/* Buttons & Segmented Controls */
.btn {
  min-height: 48px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-weight: 700; padding: 0 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.armed, .btn.dangerfill { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.sm { min-height: 40px; font-size: 13px; }
.btn.wide { width: 100%; }
.btns { display: flex; gap: 12px; } .btns > * { flex: 1; }

.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--seg); }
.seg button {
  flex: 1; min-height: 40px; border-radius: 10px; border: none; background: transparent;
  font-weight: 700; font-size: 13px; padding: 0 8px; color: var(--muted); transition: all 0.2s;
}
.seg button[aria-pressed="true"] { background: var(--surface-elevated); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,0.4); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 38px; min-width: 44px; padding: 0 16px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 12px; color: var(--muted);
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.search {
  display: flex; align-items: center; gap: 10px; min-height: 46px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--surface); padding: 0 14px; color: var(--muted);
}
.search input { flex: 1; min-width: 0; border: none; background: transparent; outline: none; min-height: 44px; color: var(--ink); }

/* Card & List Rows */
.card, .flush { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px; }
.card.flush { padding-block: 2px; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 0; border: none;
  border-bottom: 1px solid var(--line); background: transparent; text-align: left; min-height: 60px; color: var(--ink);
}
.row:last-child { border-bottom: none; }
.row .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .grow b { font-weight: 700; overflow-wrap: anywhere; font-size: 14px; }
.row .end { text-align: right; display: flex; flex-direction: column; gap: 2px; align-items: flex-end; }
.row .end b { font-weight: 800; font-size: 15px; }

.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.good { background: var(--good-bg); color: var(--good); }
.tag.gray { background: var(--seg); color: var(--muted); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }

.banner {
  display: flex; align-items: center; gap: 12px; background: var(--warn-bg); color: var(--warn);
  border-radius: 14px; padding: 12px 14px; font-size: 13px; font-weight: 600;
}
.banner span { flex: 1; }

.empty { padding: 24px 8px; text-align: center; color: var(--muted); font-size: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea {
  width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--field-line);
  background: var(--surface-elevated); padding: 0 14px; font-size: 14px; color: var(--ink);
}
.field textarea { padding: 12px 14px; min-height: 96px; resize: vertical; }
.form { display: flex; flex-direction: column; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

.scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; z-index: 30; }
.scrim.center { align-items: center; padding: 16px; z-index: 50; }
.panel {
  width: 100%; max-width: 480px; max-height: 92%; overflow-y: auto; background: var(--surface);
  color: var(--ink); border-radius: 24px 24px 0 0; padding: 20px 16px calc(24px + env(safe-area-inset-bottom,0px));
  display: flex; flex-direction: column; gap: 14px; outline: none; border-top: 1px solid var(--line);
}
.scrim.center .panel { border-radius: 24px; border: 1px solid var(--line); max-height: 86%; }
.panel .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.panel h2 { font-size: 18px; font-weight: 800; }

/* Bottom Floating Navigation */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; background: rgba(24, 24, 26, 0.92);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line);
  z-index: 20; padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
}
.nav .in { max-width: 480px; margin-inline: auto; display: flex; justify-content: space-around; align-items: center; }
.nav button {
  width: 66px; min-height: 52px; border: none; background: transparent;
  display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px;
  font-weight: 600; color: var(--muted); padding: 0;
}
.nav button[aria-current="page"] { color: var(--ink); font-weight: 700; }
.nav .mid { margin-top: -24px; }
.nav .mid .disc {
  width: 52px; height: 52px; border-radius: 50%; background: #FFFFFF; color: #0D0D0E;
  display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(255,255,255,0.25);
}

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom,0px));
  background: var(--surface-elevated); border: 1px solid var(--line); color: var(--ink);
  padding: 12px 18px; border-radius: 14px; font-size: 13px; font-weight: 600; z-index: 60;
  max-width: calc(100% - 32px); text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 13px; }
.kv span:first-child { color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.g { background: var(--lent); } .dot.o { background: var(--owe); }

.pad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; max-width: 320px; width: 100%; margin-inline: auto; }
.pad button { min-height: 60px; border-radius: 16px; font-size: 22px; font-weight: 700; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.dots { display: flex; gap: 14px; justify-content: center; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); display: block; }
.dots i.on { background: var(--ink); border-color: var(--ink); }
.err { background: var(--bad-bg); color: var(--bad); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600; }
.lockbox { min-height: 60vh; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetRoot"></div>
<div id="confRoot"></div>
<input type="file" id="photoIn" accept="image/*" hidden>
<nav class="nav" id="nav" aria-label="Main"><div class="in" id="navIn"></div></nav>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
window.__SW__=true;
(function(){
'use strict';
var ic=function(d,s,w){s=s||24;w=w||1.8;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';};
var I={
  home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  check:'<path d="M5 13l4 4L19 7"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/>',
  share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>',
  download:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  wallet:'<path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l2-3h12"/><circle cx="16.5" cy="13.5" r="1"/>',
  back:'<path d="M15 18l-6-6 6-6"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  users:'<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  camera:'<path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="4"/>'
};

var KEY='amanah.v1',DAY=86400000,storageOK=true,db=null;
var uid=function(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var fmt=function(n){return Math.round(Number(n)||0).toLocaleString('en-US');};
var num=function(v){var n=parseFloat(String(v==null?'':v).replace(/,/g,''));return isFinite(n)&&n>0?n:0;};
var $=function(s){return document.querySelector(s);};
var find=function(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;};
var sum=function(a,f){return a.reduce(function(t,x){return t+(f(x)||0);},0);};
var T=function(k,v){var s=String(k);if(v)s=s.replace(/\{(\w+)\}/g,function(m,n){return v[n]!=null?v[n]:m;});return s;};
var pad=function(n){return n<10?'0'+n:''+n;};
var startOfDay=function(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime();};
var addDays=function(t,n){var d=new Date(t);d.setDate(d.getDate()+n);return d.getTime();};
var ymd=function(t){var d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var fromYmd=function(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]).getTime():0;};
var fmtDate=function(t){return new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});};
var fmtTime=function(t){return new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});};

function defaults(){return {lang:'en',mode:'dark',palette:'teal',ui:3,bgStyle:'charcoal',cAccent:'',cLent:'#6EA8FE',cOwe:'#FF8A5B',textSize:'normal',pin:'',backupAt:0,remindLang:'en'};}
function emptyDb(){return {v:1,demo:false,settings:defaults(),people:[],loans:[],activity:[]};}
function load(){try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&Array.isArray(o.loans)&&Array.isArray(o.people)){o.settings=Object.assign(defaults(),o.settings||{});o.activity=o.activity||[];return o;}}}catch(e){storageOK=false;}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){storageOK=false;toast(T('Could not save. Storage may be full.'));}}
function log(k,v){db.activity.push({id:uid(),ts:Date.now(),k:k,v:v||{}});if(db.activity.length>3000)db.activity.splice(0,db.activity.length-3000);}

function seed(){
  var t=Date.now(),ago=function(d){return t-d*DAY;},fut=function(d){return startOfDay(t)+d*DAY;},o=emptyDb();o.demo=true;
  o.people=[['p1','Abebe','0911223344'],['p2','Hana','0922334455'],['p3','Dawit','0933445566'],['p4','Sara',''],['p5','Ahmed','0944556677']].map(function(x){return {id:x[0],name:x[1],phone:x[2],demo:true};});
  var L=function(id,dir,pid,amt,age,due,note,pays,status){return {id:id,dir:dir,pid:pid,amount:amt,ts:ago(age),due:due,note:note,photo:'',status:status||'open',payments:(pays||[]).map(function(p,i){return {id:id+'p'+i,ts:ago(p[0]),amount:p[1],note:''};}),demo:true};};
  o.loans=[
    L('l1','lent','p1',20000,30,fut(-5),'For his shop rent',[[12,10500]]),
    L('l2','lent','p2',3000,10,fut(-13),'School fees',[]),
    L('l3','lent','p3',50000,60,fut(5),'Car repair',[[40,20000]]),
    L('l4','lent','p4',1500,5,0,'',[]),
    L('l5','borrowed','p5',8000,12,fut(0),'Stock money',[])
  ];
  return o;
}

var paidOf=function(l){return sum(l.payments,function(p){return p.amount;});};
var balOf=function(l){return Math.max(0,l.amount-paidOf(l));};
var active=function(l){return l.status==='open'&&balOf(l)>0;};
var person=function(id){return find(db.people,id)||{name:'?',phone:''};};
function dueIn(l){if(!active(l)||!l.due)return null;return Math.round((startOfDay(l.due)-startOfDay(Date.now()))/DAY);}
function totals(){var a=0,b=0;db.loans.forEach(function(l){if(!active(l))return;if(l.dir==='lent')a+=balOf(l);else b+=balOf(l);});return {lent:a,owe:b};}
function loanTag(l){
  if(l.status==='forgiven')return {t:T('Forgiven'),k:'gray'};if(l.status==='gift')return {t:T('Gift'),k:'gray'};
  if(balOf(l)<=0)return {t:T('Settled'),k:'good'};
  var d=dueIn(l);if(d==null)return null;
  if(d<0)return {t:T('Overdue {n} days',{n:-d}),k:'bad'};if(d===0)return {t:T('Due today'),k:'warn'};if(d<=3)return {t:T('Due in {n} days',{n:d}),k:'warn'};
  return {t:T('Due {d}',{d:fmtDate(l.due)}),k:'gray'};
}
function alerts(){
  var out=[];
  db.loans.forEach(function(l){
    var d=dueIn(l);if(d==null||d>3)return;var nm=person(l.pid).name,a=fmt(balOf(l));
    out.push({id:l.id,d:d,sev:d<0?'bad':'warn',t:l.dir==='lent'?T('{n} owes you {a} Birr',{n:nm,a:a}):T('You owe {n} {a} Birr',{n:nm,a:a}),s:d<0?T('Overdue by {n} days',{n:-d}):d===0?T('Due today'):T('Due in {n} days',{n:d})});
  });
  return out.sort(function(a,b){return a.d-b.d;});
}

var state={tab:'home',pq:'',ptab:'all',side:'lent',filter:'all',q:'',pages:[],sheet:null,f:{},conf:null,locked:false,pin:'',actFilter:'today',actDate:'',actFrom:'',actTo:''};
var tag=function(t,k){return '<span class="tag '+k+'">'+esc(t)+'</span>';};
var btn=function(a,label,cls,o){o=o||{};return '<button type="button" class="btn'+(cls?' '+cls:'')+' wide" data-a="'+a+'"'+(o.id?' data-id="'+esc(o.id)+'"':'')+(o.v!=null?' data-v="'+esc(o.v)+'"':'')+'>'+(o.icon?ic(o.icon,18,2):'')+esc(label)+'</button>';};
var btns=function(a,b){return '<div class="btns">'+a+b+'</div>';};
var kv=function(k,v){return '<div class="kv"><span>'+esc(k)+'</span><span>'+v+'</span></div>';};
var errBox=function(){return '<p class="err" id="sheetErr" role="alert" hidden></p>';};
function F(id,d){var v=state.f[id];return v==null?(d==null?'':d):v;}
function fInput(id,label,o){o=o||{};return '<label class="field" for="'+id+'">'+esc(label)+'<input id="'+id+'" data-f'+(o.type?' type="'+o.type+'"':'')+(o.im?' inputmode="'+o.im+'"':'')+(o.list?' list="'+o.list+'"':'')+(o.max?' max="'+o.max+'"':'')+(o.ml?' maxlength="'+o.ml+'"':'')+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+' autocomplete="off" value="'+esc(F(id,o.def))+'"></label>';}
function fArea(id,label,o){o=o||{};return '<label class="field" for="'+id+'">'+esc(label)+'<textarea id="'+id+'" data-f>'+esc(F(id,o.def))+'</textarea></label>';}
function seg(opts,cur,a){return '<div class="seg" role="group">'+opts.map(function(o){return '<button type="button" data-a="'+a+'" data-v="'+esc(o.v)+'" aria-pressed="'+(String(cur)===String(o.v))+'">'+esc(o.t)+'</button>';}).join('')+'</div>';}
function chips(opts,cur,a){return '<div class="chips" role="group">'+opts.map(function(o){return '<button type="button" class="chip" data-a="'+a+'" data-v="'+esc(o.v)+'" aria-pressed="'+(String(cur)===String(o.v))+'">'+esc(o.t)+'</button>';}).join('')+'</div>';}
function pagehead(t,right){return '<header class="pagehead"><button class="iconbtn" data-a="back" aria-label="'+esc(T('Back'))+'">'+ic(I.back,22,2)+'</button><h1>'+esc(t)+'</h1>'+(right||'')+'</header>';}
function topbar(t,sub,right){return '<header class="top"><div><h1>'+esc(t)+'</h1>'+(sub?'<p class="sub">'+esc(sub)+'</p>':'')+'</div>'+(right?'<div class="acts">'+right+'</div>':'')+'</header>';}
function empty(t){return '<p class="empty">'+esc(t)+'</p>';}

function loanRow(l){
  var p=person(l.pid),tg=loanTag(l),b=balOf(l),pc=paidOf(l);
  return '<button class="row" data-a="loan" data-id="'+l.id+'"><span class="grow"><b>'+esc(p.name)+'</b><small>'+esc(l.note||fmtDate(l.ts))+'</small>'+(tg?'<span class="tags">'+tag(tg.t,tg.k)+'</span>':'')+'</span><span class="end"><b class="num">'+fmt(b>0&&l.status==='open'?b:l.amount)+'</b><small>'+(pc>0&&b>0?esc(T('of {n}',{n:fmt(l.amount)})):esc(T('Birr')))+'</small></span></button>';
}

function loanList(){
  var q=state.q.trim().toLowerCase(),f=state.filter;
  var list=db.loans.filter(function(l){
    if(l.dir!==state.side)return false;var d=dueIn(l);
    if(f==='all'&&!active(l))return false;
    if(f==='overdue'&&!(d!=null&&d<0))return false;
    if(f==='soon'&&!(d!=null&&d>=0&&d<=7))return false;
    if(f==='done'&&active(l))return false;
    if(q&&(person(l.pid).name+' '+(l.note||'')).toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){var da=dueIn(a),db_=dueIn(b);if(da==null&&db_==null)return b.ts-a.ts;if(da==null)return 1;if(db_==null)return -1;return da-db_;});
  return list.length?list.map(loanRow).join(''):empty(f==='done'?T('Nothing settled yet.'):T('Nothing here. Tap + to add a loan.'));
}

/* REFACTORED BENTO HERO AREA WITH PERFECT SVG RING AND SPARKLINE */
function heroHtml(t){
  var tot=0,pd=0;db.loans.forEach(function(l){if(l.dir==='lent'&&l.status==='open'){tot+=l.amount;pd+=paidOf(l);}});
  var pct=tot?Math.round(pd/tot*100):0;
  
  // Clean SVG Circle Ring Math
  var R=38, C=2*Math.PI*R, strokeDash=C.toFixed(1), strokeOffset=(C*(1-pct/100)).toFixed(1);

  // Sparkline Curve Calculation
  var now=Date.now(), pts=[], i;
  for(i=7;i>=0;i--){
    var at=now-i*7*864e5, v=0;
    db.loans.forEach(function(l){
      if(l.status!=='open'||l.ts>at)return;
      var p=0; l.payments.forEach(function(x){if(x.ts<=at)p+=x.amount;});
      v+=(l.dir==='lent'?1:-1)*Math.max(0,l.amount-p);
    });
    pts.push(v);
  }
  var lo=Math.min.apply(0,pts), hi=Math.max.apply(0,pts), rg=(hi-lo)||1, W=300, H=48;
  var d=pts.map(function(v,k){ return (k?'L':'M')+(k*W/7).toFixed(1)+' '+(H-6-(v-lo)/rg*(H-12)).toFixed(1); }).join(' ');

  return '<div class="bento-grid">' +
    /* Card 1: Repayment Ring */
    '<div class="bento-card" style="align-items:center;justify-content:center;padding:12px;">' +
      '<div class="ring-container">' +
        '<div class="ring">' +
          '<svg viewBox="0 0 100 100" aria-hidden="true">' +
            '<circle cx="50" cy="50" r="'+R+'" class="rt"/>' +
            '<circle cx="50" cy="50" r="'+R+'" class="rf" stroke-dasharray="'+strokeDash+'" stroke-dashoffset="'+strokeOffset+'"/>' +
          '</svg>' +
          '<div class="rc"><b>'+pct+'%</b><span>'+esc(T('repaid'))+'</span></div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    /* Card 2 & 3: Totals */
    '<div style="display:flex;flex-direction:column;gap:12px;">' +
      '<div class="bento-card" style="padding:12px 14px;">' +
        '<div class="card-label"><i class="dot g" style="margin-right:6px"></i>'+esc(T('People owe you'))+'</div>' +
        '<b class="num" style="font-size:20px;font-weight:800;color:var(--lent);">'+fmt(t.lent)+'</b>' +
      '</div>' +
      '<div class="bento-card" style="padding:12px 14px;">' +
        '<div class="card-label"><i class="dot o" style="margin-right:6px"></i>'+esc(T('You owe'))+'</div>' +
        '<b class="num" style="font-size:20px;font-weight:800;color:var(--owe);">'+fmt(t.owe)+'</b>' +
      '</div>' +
    '</div>' +

    /* Card 4: Net Position & Sparkline Graph */
    '<div class="bento-card span-2" style="padding:14px 16px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;">' +
        '<div class="card-label" style="margin-bottom:0;">'+esc(T('Net position'))+'</div>' +
        '<b class="num" style="font-size:16px;font-weight:800;">'+(t.lent-t.owe>=0?'+':'-')+fmt(Math.abs(t.lent-t.owe))+' '+esc(T('Birr'))+'</b>' +
      '</div>' +
      '<div class="sparkline-container">' +
        '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" class="sparkline-svg">' +
          '<defs><linearGradient id="sparkline-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--lent)" stop-opacity="0.4"/><stop offset="100%" stop-color="var(--lent)" stop-opacity="0"/></linearGradient></defs>' +
          '<path d="'+d+' L'+W+' '+H+' L0 '+H+'Z" class="ta"/>' +
          '<path d="'+d+'" class="tl"/>' +
        '</svg>' +
      '</div>' +
      '<div style="display:flex;justify-content:space-between;margin-top:2px;"><small style="font-size:11px;color:var(--muted);">'+esc(T('Last 8 weeks'))+'</small></div>' +
    '</div>' +
  '</div>';
}

function viewHome(){
  var t=totals(),al=alerts(),n=al.length;
  return topbar('Amanah',new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}),'<button class="iconbtn" data-a="alerts" aria-label="'+esc(T('Notifications'))+'">'+ic(I.bell,20)+(n?'<span class="badge">'+n+'</span>':'')+'</button>')+
  heroHtml(t)+
  (n?'<button class="banner" data-a="alerts" style="width:100%;text-align:left;border:none"><span>'+esc(T('{n} repayments need attention',{n:n}))+'</span>'+ic(I.chev,18)+'</button>':'')+
  seg([{v:'lent',t:T('I lent')},{v:'borrowed',t:T('I borrowed')}],state.side,'side')+
  '<label class="search">'+ic(I.search,18)+'<input id="q" type="search" placeholder="'+esc(T('Search name or note'))+'" value="'+esc(state.q)+'" data-live="list" autocomplete="off"></label>'+
  chips([{v:'all',t:T('Open')},{v:'overdue',t:T('Overdue')},{v:'soon',t:T('Due in 7 days')},{v:'done',t:T('Settled')}],state.filter,'filter')+
  '<section class="card flush" id="list">'+loanList()+'</section>';
}

function peopleList(){
  var q=(state.pq||'').trim().toLowerCase(),t=state.ptab||'all';
  var rows=db.people.filter(function(p){
    if(q&&(p.name||'').toLowerCase().indexOf(q)<0&&(p.phone||'').indexOf(q)<0)return false;
    return true;
  }).map(function(p){
    var net=0; db.loans.forEach(function(l){if(l.pid===p.id&&active(l))net+=l.dir==='lent'?balOf(l):-balOf(l);});
    var col=net>0?'var(--good)':net<0?'var(--bad)':'var(--ink)';
    return '<button class="row" data-a="person" data-id="'+p.id+'"><span class="grow"><b>'+esc(p.name)+'</b><small>'+esc(p.phone||T('No phone'))+'</small></span><span class="end"><b class="num" style="color:'+col+'">'+fmt(Math.abs(net))+'</b><small>'+esc(net>0?T('owes you'):net<0?T('you owe'):T('settled'))+'</small></span></button>';
  }).join('');
  return rows||empty(T('No people found.'));
}

function viewPeople(){
  return topbar(T('People'),T('{n} people',{n:db.people.length}))+
  '<label class="search">'+ic(I.search,18)+'<input id="pq" type="search" placeholder="'+esc(T('Search people'))+'" value="'+esc(state.pq||'')+'" data-live="plist" autocomplete="off"></label>'+
  '<section class="card flush" id="plist">'+peopleList()+'</section>';
}

function viewAlerts(){
  var al=alerts();
  return pagehead(T('Notifications'))+'<section class="card flush" style="margin-top:12px;">'+(al.length?al.map(function(a){return '<button class="row" data-a="loan" data-id="'+a.id+'"><span style="width:8px;height:8px;border-radius:50%;flex:none;background:'+(a.sev==='bad'?'var(--bad)':'var(--warn)')+'"></span><span class="grow"><b>'+esc(a.t)+'</b><small>'+esc(a.s)+'</small></span>'+ic(I.chev,18)+'</button>';}).join(''):empty(T('Nothing is due soon.')))+'</section>';
}

function viewSettings(){
  return topbar(T('Settings'))+'<section class="card flush" style="margin-top:12px;">'+
  '<button type="button" class="row" data-a="backup"><span class="grow"><b>'+esc(T('Download Backup'))+'</b><small>'+esc(T('Save your data locally'))+'</small></span>'+ic(I.download,18)+'</button>'+
  '<button type="button" class="row" data-a="resetAll"><span class="grow"><b style="color:var(--bad)">'+esc(T('Erase Everything'))+'</b></span></button>'+
  '</section>';
}

function viewLock(){
  var d='';for(var i=0;i<4;i++)d+='<i class="'+(i<state.pin.length?'on':'')+'"></i>';
  var keys=['1','2','3','4','5','6','7','8','9','','0','del'].map(function(k){return k===''?'<span></span>':'<button type="button" data-a="pinKey" data-v="'+k+'">'+(k==='del'?'&#9003;':k)+'</button>';}).join('');
  return '<div class="lockbox"><h1 style="text-align:center;font-family:Unbounded;">AMANAH</h1><p class="sub" style="text-align:center">'+esc(T('Enter your PIN'))+'</p><div class="dots">'+d+'</div><div class="pad">'+keys+'</div></div>';
}

var SHEETS={
  quick:function(){
    return {title:T('Add Loan'),body:'<div class="form">'+btn('addLoan',T('I lent money'),'primary',{v:'lent',icon:I.wallet})+btn('addLoan',T('I borrowed money'),'',{v:'borrowed',icon:I.download})+'</div>'};
  },
  loanForm:function(s){
    var dir=F('f_dir','lent');
    return {title:T('Add Loan'),body:'<div class="form">'+seg([{v:'lent',t:T('I lent')},{v:'borrowed',t:T('I borrowed')}],dir,'fDir')+
      fInput('f_name',T('Person Name'))+fInput('f_phone',T('Phone Number (Optional)'),{type:'tel'})+
      '<div class="grid2">'+fInput('f_amt',T('Amount (Birr)'),{im:'numeric'})+fInput('f_date',T('Date'),{type:'date',max:ymd(Date.now()),def:ymd(Date.now())})+'</div>'+
      fInput('f_due',T('Repayment Date (Optional)'),{type:'date'})+fInput('f_note',T('Note'))+errBox()+btn('loanSave',T('Save Loan'),'primary')+'</div>'};
  },
  loan:function(s){
    var l=find(db.loans,s.id);if(!l)return null;var p=person(l.pid),b=balOf(l);
    return {title:p.name,body:'<div class="form">'+
      kv(T('Amount'),'<b class="num">'+fmt(l.amount)+' Birr</b>')+kv(T('Balance'),'<b class="num">'+fmt(b)+' Birr</b>')+kv(T('Date'),fmtDate(l.ts))+
      (active(l)?btn('payOpen',T('Record Payment'),'primary',{id:l.id}):'')+
      btn('loanDel',T('Delete Loan'),'danger',{id:l.id})+'</div>'};
  },
  pay:function(s){
    var l=find(db.loans,s.id);if(!l)return null;
    return {title:T('Record Payment'),body:'<div class="form">'+fInput('f_pay',T('Amount (Birr)'),{im:'numeric',def:String(balOf(l))})+errBox()+btn('paySave',T('Save Payment'),'primary',{id:l.id})+'</div>'};
  }
};

function renderSheet(){
  var root=$('#sheetRoot'),s=state.sheet;if(!s){root.innerHTML='';return;}
  var r=SHEETS[s.t]?SHEETS[s.t](s):null;if(!r){state.sheet=null;root.innerHTML='';return;}
  root.innerHTML='<div class="scrim" data-scrim="1"><div class="panel" role="dialog"><div class="head"><h2>'+esc(r.title)+'</h2><button type="button" class="iconbtn" data-a="closeSheet">'+ic(I.x,20)+'</button></div>'+r.body+'</div></div>';
}

function renderConf(){
  var root=$('#confRoot'),c=state.conf;if(!c){root.innerHTML='';return;}
  root.innerHTML='<div class="scrim center" data-scrim="1"><div class="panel" role="alertdialog"><h2>'+esc(c.title)+'</h2><div class="btns"><button type="button" class="btn" data-a="confNo">'+esc(T('Cancel'))+'</button><button type="button" class="btn dangerfill" data-a="confYes">'+esc(T('Confirm'))+'</button></div></div></div>';
}

function navHtml(){
  var b=function(t,icon,label){return '<button type="button" data-a="tab" data-v="'+t+'"'+(state.tab===t?' aria-current="page"':'')+'>'+ic(icon,22)+esc(label)+'</button>';};
  return b('home',I.home,T('Home'))+b('people',I.users,T('People'))+'<button type="button" class="mid" data-a="quick"><span class="disc">'+ic(I.plus,26,2.2)+'</span></button>'+b('activity',I.clock,T('Activity'))+b('settings',I.gear,T('Settings'));
}

function render(){
  var top=state.pages[state.pages.length-1];
  var html=state.locked?viewLock():top==='alerts'?viewAlerts():state.tab==='home'?viewHome():state.tab==='people'?viewPeople():viewSettings();
  $('#app').innerHTML=html;
  $('#nav').hidden=state.locked||!!top; if(!state.locked&&!top)$('#navIn').innerHTML=navHtml();
  renderSheet(); renderConf();
  document.documentElement.style.overflow=(state.sheet||state.conf)?'hidden':'';
}

function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true;},2600);}
function showErr(m){var e=$('#sheetErr');if(!e){toast(m);return false;}e.textContent=m;e.hidden=false;return false;}
function ask(o){state.conf=o;render();}

function act(a,el){
  var id=el.getAttribute('data-id'),v=el.getAttribute('data-v'),l=id?find(db.loans,id):null;
  switch(a){
    case 'tab':state.tab=v;state.pages=[];state.sheet=null;break;
    case 'quick':state.sheet={t:'quick'};break;
    case 'closeSheet':state.sheet=null;break;
    case 'confNo':state.conf=null;break;
    case 'confYes':var fn=state.conf&&state.conf.fn;state.conf=null;if(fn)fn();break;
    case 'side':state.side=v;break;
    case 'filter':state.filter=v;break;
    case 'addLoan':state.sheet={t:'loanForm'};state.f={f_dir:v,f_date:ymd(Date.now())};break;
    case 'fDir':state.f.f_dir=v;break;
    case 'loanSave':
      var name=(state.f.f_name||'').trim(),amt=num(state.f.f_amt);
      if(!name)return showErr('Enter a name');if(!amt)return showErr('Enter an amount');
      var p=find(db.people,name)||(function(){var x={id:uid(),name:name,phone:state.f.f_phone||''};db.people.push(x);return x;})();
      db.loans.push({id:uid(),dir:state.f.f_dir||'lent',pid:p.id,amount:amt,ts:Date.now(),due:fromYmd(state.f.f_due),note:state.f.f_note||'',status:'open',payments:[]});
      save();state.sheet=null;toast('Saved');break;
    case 'loan':state.sheet={t:'loan',id:id};break;
    case 'payOpen':state.sheet={t:'pay',id:id};state.f={};break;
    case 'paySave':
      var pamt=num(state.f.f_pay);if(!pamt)return showErr('Enter an amount');
      l.payments.push({id:uid(),ts:Date.now(),amount:pamt});save();state.sheet=null;toast('Payment Recorded');break;
    case 'loanDel':ask({title:'Delete this loan?',fn:function(){db.loans=db.loans.filter(function(x){return x.id!==id;});save();state.sheet=null;toast('Deleted');}});break;
    case 'backup':
      var b=new Blob([JSON.stringify(db)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
      a.href=u;a.download='amanah-backup.json';a.click();break;
    case 'resetAll':ask({title:'Erase all data?',fn:function(){db=emptyDb();save();render();}});break;
    case 'alerts':state.pages.push('alerts');break;
    case 'back':state.pages.pop();break;
  }
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;act(el.getAttribute('data-a'),el);render();
});
document.addEventListener('input',function(e){
  if(e.target.hasAttribute('data-f'))state.f[e.target.id]=e.target.value;
  if(e.target.id==='q'){state.q=e.target.value;$('#list').innerHTML=loanList();}
  if(e.target.id==='pq'){state.pq=e.target.value;$('#plist').innerHTML=peopleList();}
});

db=load();if(!db){db=seed();save();}
render();
})();
</script>
